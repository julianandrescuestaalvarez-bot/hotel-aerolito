<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Hotel Aerolito</title>
    <link rel="stylesheet" href="../static/styles.css">
</head>

<body class="pagina-centrada">
    <div class="tarjeta-centrada">
        <h2>Crear Cuenta</h2>

        <div id="mensaje" class="alerta" style="display:none;" role="alert" aria-live="polite"></div>

        <form id="formRegistro" novalidate>
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" autocomplete="name" required>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" autocomplete="new-password" required minlength="6">

            <label for="contrasenaConfirmar">Confirmar contraseña:</label>
            <input type="password" id="contrasenaConfirmar" name="contrasenaConfirmar" autocomplete="new-password" required minlength="6">

            <button type="submit" id="btnRegistrar">Registrarme</button>
        </form>

        <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
    </div>

    <script src="../static/auth.js"></script>
    <script>
        /* ✅ Endpoint y campos confirmados contra tu auth.py real:
           POST /api/auth/registro  con body { nombre, email, "contraseña" }
           Respuesta: { mensaje, token, usuario: {...} } — deja al usuario logueado de inmediato. */

        function mostrarMensaje(texto, tipo) {
            var el = document.getElementById('mensaje');
            el.textContent = texto;
            el.className = 'alerta alerta-' + tipo;
            el.style.display = 'block';
        }
        function ocultarMensaje() {
            document.getElementById('mensaje').style.display = 'none';
        }

        document.getElementById('formRegistro').addEventListener('submit', function (e) {
            e.preventDefault();

            var nombre = document.getElementById('nombre').value.trim();
            var email = document.getElementById('email').value.trim();
            var contrasena = document.getElementById('contrasena').value;
            var confirmar = document.getElementById('contrasenaConfirmar').value;

            if (!nombre || !email || !contrasena || !confirmar) {
                mostrarMensaje('⚠ Todos los campos son obligatorios.', 'error');
                return;
            }
            if (contrasena.length < 6) {
                mostrarMensaje('⚠ La contraseña debe tener al menos 6 caracteres.', 'error');
                return;
            }
            if (contrasena !== confirmar) {
                mostrarMensaje('⚠ Las contraseñas no coinciden.', 'error');
                return;
            }

            var btn = document.getElementById('btnRegistrar');
            var textoOriginal = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Creando cuenta...';
            ocultarMensaje();

            fetch(API_BASE_URL + '/auth/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nombre: nombre,
                    email: email,
                    "contraseña": contrasena
                })
            })
                .then(function (res) {
                    return res.json().then(function (data) {
                        return { ok: res.ok, data: data };
                    });
                })
                .then(function (resultado) {
                    if (!resultado.ok) {
                        var msg = resultado.data.error || 'No se pudo completar el registro.';
                        mostrarMensaje('⚠ ' + msg, 'error');
                        return;
                    }

                    var data = resultado.data;
                    guardarSesion(data.token, data.usuario);

                    mostrarMensaje('✔ Cuenta creada. Redirigiendo...', 'exito');
                    setTimeout(function () {
                        window.location.href = 'Index.html';
                    }, 800);
                })
                .catch(function (err) {
                    console.error('Error de registro:', err);
                    mostrarMensaje('⚠ No se pudo conectar con el servidor. Verifica que el backend esté corriendo.', 'error');
                })
                .finally(function () {
                    btn.disabled = false;
                    btn.textContent = textoOriginal;
                });
        });
    </script>
</body>
</html>
