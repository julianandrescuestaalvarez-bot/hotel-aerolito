<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar Habitación - Hotel Aerolito</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/styles.css">
    <link rel="stylesheet" href="../static/css/seleccion.css">
</head>
<body>

    <div class="contenedor-pagina">

        <a href="Index.html" class="btn-volver">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Volver al inicio
        </a>

        <div class="barra-superior">
            <span class="marca">
                <span class="marca-icono">HA</span>
                Buscar habitación
            </span>
            <div class="user-profile" id="nav-auth"></div>
        </div>

        <div id="mensaje" class="alerta" style="display:none;" role="alert" aria-live="polite"></div>

        <form id="formBusqueda" class="form-busqueda" novalidate>
            <div class="campo">
                <label for="fechaEntrada">Check-in</label>
                <input type="date" id="fechaEntrada" name="fecha_entrada" required>
            </div>
            <div class="campo">
                <label for="fechaSalida">Check-out</label>
                <input type="date" id="fechaSalida" name="fecha_salida" required>
            </div>
            <div class="campo">
                <label for="numHuespedes">Huéspedes</label>
                <select id="numHuespedes" name="numero_huespedes">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
            </div>
            <button type="submit" id="btnBuscar">Buscar disponibilidad</button>
        </form>

        <div class="grid-habitaciones" id="gridHabitaciones">
            <p class="estado-vacio">Elige tus fechas y presiona "Buscar disponibilidad" para ver las habitaciones libres.</p>
        </div>

    </div>

    <script src="../static/auth.js"></script>
    <script>
        /* ✅ Endpoint y campos confirmados contra tu backend real:
           GET /api/habitaciones/?checkin=YYYY-MM-DD&checkout=YYYY-MM-DD&capacidad=N
           Respuesta: { total, habitaciones: [{ id, numero, tipo, precio_noche, capacidad, descripcion, estado }] } */

        function mostrarMensaje(texto, tipo) {
            var el = document.getElementById('mensaje');
            el.textContent = texto;
            el.className = 'alerta alerta-' + tipo;
            el.style.display = 'block';
        }
        function ocultarMensaje() {
            document.getElementById('mensaje').style.display = 'none';
        }

        // Fechas mínimas: hoy en adelante
        var hoy = new Date().toISOString().split('T')[0];
        document.getElementById('fechaEntrada').min = hoy;
        document.getElementById('fechaSalida').min = hoy;
        document.getElementById('fechaEntrada').addEventListener('change', function () {
            document.getElementById('fechaSalida').min = this.value;
        });

        document.getElementById('formBusqueda').addEventListener('submit', function (e) {
            e.preventDefault();

            var entrada = document.getElementById('fechaEntrada').value;
            var salida = document.getElementById('fechaSalida').value;
            var huespedes = document.getElementById('numHuespedes').value;

            if (!entrada || !salida) {
                mostrarMensaje('⚠ Selecciona ambas fechas.', 'error');
                return;
            }
            if (salida <= entrada) {
                mostrarMensaje('⚠ La fecha de salida debe ser posterior a la de entrada.', 'error');
                return;
            }

            ocultarMensaje();
            var $grid = document.getElementById('gridHabitaciones');
            $grid.innerHTML = '<p class="estado-vacio">Buscando habitaciones disponibles...</p>';

            var url = API_BASE_URL + '/habitaciones/' +
                '?checkin=' + encodeURIComponent(entrada) +
                '&checkout=' + encodeURIComponent(salida) +
                '&capacidad=' + encodeURIComponent(huespedes);

            fetch(url, { headers: cabecerasAuth() })
                .then(function (res) {
                    if (!res.ok) throw new Error('No se pudo consultar disponibilidad.');
                    return res.json();
                })
                .then(function (data) {
                    var habitaciones = data.habitaciones || [];

                    if (!habitaciones || habitaciones.length === 0) {
                        $grid.innerHTML = '<p class="estado-vacio">No hay habitaciones disponibles para esas fechas.</p>';
                        return;
                    }

                    $grid.innerHTML = habitaciones.map(function (h) {
                        return '' +
                            '<div class="habitacion-card">' +
                                '<div class="habitacion-imagen"></div>' +
                                '<div class="habitacion-cuerpo">' +
                                    '<h3>' + h.tipo + ' — N.° ' + h.numero + '</h3>' +
                                    '<div class="habitacion-detalle">' +
                                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>' +
                                        'Capacidad: ' + h.capacidad + ' huéspedes' +
                                    '</div>' +
                                    '<div class="habitacion-precio">$' + h.precio_noche + ' / noche</div>' +
                                    '<button type="button" class="btnSeleccionar" ' +
                                        'data-id="' + h.id + '" data-precio="' + h.precio_noche + '" ' +
                                        'data-tipo="' + h.tipo + '" data-numero="' + h.numero + '">' +
                                        'Ver detalles / Reservar' +
                                    '</button>' +
                                '</div>' +
                            '</div>';
                    }).join('');

                    document.querySelectorAll('.btnSeleccionar').forEach(function (btn) {
                        btn.addEventListener('click', function () {
                            if (!haySesion()) {
                                mostrarMensaje('⚠ Debes iniciar sesión para reservar.', 'error');
                                setTimeout(function () { window.location.href = 'login.html'; }, 1200);
                                return;
                            }

                            var seleccion = {
                                habitacion_id: btn.dataset.id,
                                tipo: btn.dataset.tipo,
                                numero: btn.dataset.numero,
                                precio_noche: btn.dataset.precio,
                                fecha_checkin: entrada,
                                fecha_checkout: salida,
                                num_huespedes: huespedes
                            };
                            sessionStorage.setItem('aerolito_seleccion', JSON.stringify(seleccion));
                            window.location.href = 'resumenReserva.html';
                        });
                    });
                })
                .catch(function (err) {
                    console.error(err);
                    $grid.innerHTML = '';
                    mostrarMensaje('⚠ No se pudo cargar la disponibilidad. Verifica que el backend esté corriendo.', 'error');
                });
        });
    </script>
</body>
</html>
